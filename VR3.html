<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body
<a-scene>
    <!-- الأرضية والسماء (ثابتة) -->
    <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
    <a-sky color="#ECECEC"></a-sky>

    <!-- المكعب: يدور حول Y ويتحرك للأعلى والأسفل -->
    <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"
           animation__rot="property: rotation; to: 0 405 0; loop: true; dur: 2000" 
           animation__move="property: position; to: -1 2.5 -3; dir: alternate; loop: true; dur: 1000">
    </a-box>

    <!-- الكرة: موضوعة بجانب المكعب وتدور حول نفسها 360 درجة -->
    <a-sphere position="1 1.25 -5" radius="1.25" color="#EF2D5E"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
    </a-sphere>
    
    <!-- الأسطوانة: موضوعة بجانب المكعب وتدور حول نفسها 360 درجة -->
    <a-cylinder position="2 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
    </a-cylinder>

    <!-- الكاميرا: ثابتة تماماً بدون أي حركة -->
    <a-camera position="0 1.6 3"></a-camera>
</a-scene>
</body>
</html>
