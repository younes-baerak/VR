<!DOCTYPE html>
<html>

<head>
    <title>LAB 6 - Exercise 2.2</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

</head>

<body>

<a-scene>

    <!-- Sky -->
    <a-sky color="#ECECE0"></a-sky>


    <!-- Ground -->
    <a-entity
        geometry="primitive: plane; width: 20; height: 20"
        position="0 0 0"
        rotation="-90 0 0"
        material="color: #7BC8A4">
    </a-entity>


    <!-- Box Entity -->
    <a-entity
        geometry="primitive: box"
        position="-2 1 -5"
        scale="1.5 1.5 1.5"
        material="color: #4CC3D9; metalness: 0.7; roughness: 0.3"
        animation__rotation="
            property: rotation;
            to: 0 360 0;
            dur: 4000;
            easing: linear;
            loop: true"
        animation__scale="
            property: scale;
            from: 1.5 1.5 1.5;
            to: 2 2 2;
            dir: alternate;
            dur: 2000;
            loop: true">
    </a-entity>


    <!-- Sphere Entity -->
    <a-entity
        geometry="primitive: sphere; radius: 0.8"
        position="0 1 -5"
        material="color: #EF2D5E; metalness: 0.5"
        animation__position="
            property: position;
            from: 0 1 -5;
            to: 0 3 -5;
            dir: alternate;
            dur: 2000;
            loop: true"
        animation__color="
            property: material.color;
            from: #EF2D5E;
            to: #FFC65D;
            dir: alternate;
            dur: 2000;
            loop: true">
    </a-entity>


    <!-- Cylinder Entity -->
    <a-entity
        geometry="primitive: cylinder; radius: 0.5; height: 1.5"
        position="2 0.75 -5"
        material="color: #FFC65D"
        animation__scale="
            property: scale;
            from: 1 1 1;
            to: 1 2 1;
            dir: alternate;
            dur: 2000;
            loop: true"
        animation__rotation="
            property: rotation;
            to: 0 360 0;
            dur: 5000;
            easing: linear;
            loop: true">
    </a-entity>


    <!-- Light -->
    <a-entity
        light="type: directional; color: white; intensity: 1"
        position="-3 5 5">
    </a-entity>


    <!-- Camera -->
    <a-entity
        camera
        position="0 2 5"
        look-controls
        wasd-controls>
    </a-entity>


</a-scene>

</body>
</html>
