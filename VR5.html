<!DOCTYPE html>
<html>

<head>
    <title>LAB 6</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

</head>

<body>

<a-scene>

    <a-assets>
        <!-- External Space Background -->
        <img id="sky"
        src="https://images.unsplash.com/photo-1767188789408-01a4d8c6f0ad?auto=format&fit=crop&fm=jpg&q=80&w=3000"
        crossorigin="anonymous">
    </a-assets>


    <!-- Space Background -->
    <a-sky
        src="#sky"
        rotation="0 -90 0">
    </a-sky>


    <!-- Box -->
    <a-entity
        geometry="primitive: box"
        scale="4 4 4"
        position="0 4 -10"
        material="color: #c5b2a0;
                  metalness: 1;
                  roughness: 0.3;
                  sphericalEnvMap: #sky"
        animation="property: rotation;
                   easing: linear;
                   dur: 10000;
                   to: 0 0 360;
                   loop: true">
    </a-entity>


    <!-- Plane -->
    <a-entity
        geometry="primitive: plane;
                  width: 10000;
                  height: 10000"
        position="0 -10 0"
        rotation="-90 0 0"
        material="color: #151B30;
                  transparent: true;
                  metalness: 0.6;
                  roughness: 0.4">
    </a-entity>


    <!-- Light -->
    <a-entity
        light="type: point;
               color: white;
               intensity: 0.5"
        position="-5 5 15">
    </a-entity>


</a-scene>

</body>
</html>
