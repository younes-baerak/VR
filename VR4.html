<!DOCTYPE html>
<html>
<head>
    <title>LAB 6</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

    <a-assets>
    </a-assets>

    <!-- Box Entity -->
    <a-entity
        geometry="primitive: box"
        position="0 4 -10"
        scale="4 4 4"
        material="color: #c5b2a0; metalness: 1; roughness: 0.3"
        animation="property: rotation;
                   from: 0 0 0;
                   to: 0 0 360;
                   dur: 10000;
                   easing: linear;
                   loop: true">
    </a-entity>

    <!-- Plane Entity -->
    <a-entity
        geometry="primitive: plane; width: 100; height: 100"
        position="0 -10 0"
        rotation="-90 0 0"
        material="color: #888888">
    </a-entity>

    <!-- Light Entity -->
    <a-entity
        light="type: point; color: white; intensity: 0.5"
        position="-5 5 15">
    </a-entity>

    <!-- Sky Entity -->
    <a-entity
        geometry="primitive: sphere; radius: 500"
        material="color: #ECECE0; side: back">
    </a-entity>

</a-scene>

</body>
</html>
