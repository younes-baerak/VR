<!DOCTYPE html>
<html>
<head>
    <title>LAB 6</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

    <a-assets>
        <img id="earth"
        src="https://assets.science.nasa.gov/content/dam/science/psd/photojournal/pia/pia00/pia00452/PIA00452.jpg"
        crossorigin="anonymous">
    </a-assets>

    <!-- Space Background -->
    <a-sky color="#050816"></a-sky>

    <!-- Earth -->
    <a-entity
        geometry="primitive: sphere; radius: 3"
        position="0 2 -12"
        material="src: #earth; roughness: 1"
        animation="property: rotation;
                   to: 0 360 0;
                   dur: 20000;
                   easing: linear;
                   loop: true">
    </a-entity>

    <!-- Box -->
    <a-entity
        geometry="primitive: box"
        position="-4 1 -6"
        material="color: #4CC3D9"
        animation="property: rotation;
                   to: 360 360 0;
                   dur: 5000;
                   easing: linear;
                   loop: true">
    </a-entity>

    <!-- Cylinder -->
    <a-entity
        geometry="primitive: cylinder"
        position="4 1 -6"
        material="color: #FFC65D"
        animation="property: scale;
                   from: 1 1 1;
                   to: 1 2 1;
                   dir: alternate;
                   dur: 2000;
                   loop: true">
    </a-entity>

    <!-- Ground -->
    <a-entity
        geometry="primitive: plane; width: 100; height: 100"
        position="0 -2 0"
        rotation="-90 0 0"
        material="color: #111827">
    </a-entity>

    <!-- Light -->
    <a-entity
        light="type: ambient; intensity: 1">
    </a-entity>

    <!-- Camera -->
    <a-entity
        camera
        position="0 2 3"
        look-controls
        wasd-controls>
    </a-entity>

</a-scene>

</body>
</html>
