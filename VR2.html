<html>
    <head>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    </head>
    <body>
<a-scene>
  
    <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
    <a-sky color="#ECECEC"></a-sky>

  

    <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"
           animation__rot="property: rotation; to: 0 405 0; loop: true; dur: 2000" 
           animation__move="property: position; to: -1 2.5 -3; dir: alternate; loop: true; dur: 1000">
           
        
        <a-sphere position="1 0.75 -2" radius="1.25" color="#EF2D5E"></a-sphere>
        
        <a-cylinder position="2 0.25 0" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
    </a-box>


    <a-entity position="0 0 0" 
              animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
      
    </a-entity>


    <a-camera position="0 1.6 3"
              animation="property: zoom; to: 2; dir: alternate; loop: true; dur: 3000; easing: linear"></a-camera>
              


</a-scene>
</body>
</html>
