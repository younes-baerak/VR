<a-scene>
    <!-- الأرضية والسماء (ثابتة كما في الأصل) -->
    <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
    <a-sky color="#ECECEC"></a-sky>

    <!-- 
      الطلب الثاني (2.2.1): المكعب يدور حول Y (ضعف) و يتحرك للأعلى والأسفل (3 أضعاف)
      الطلب الثالث (3.2.1): المشهد بالكامل يدور حول النقطة (0, 1.6, 3) بزاوية 360
      الطلب الخامس (5.2.1): العناصر تتباعد وتتقارب (الحركة هنا في المكعب)
    -->
    <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"
           animation__rot="property: rotation; to: 0 405 0; loop: true; dur: 2000" 
           animation__move="property: position; to: -1 2.5 -3; dir: alternate; loop: true; dur: 1000">
           
        <!-- الطلب الرابع (4.2.1): المكعب يدور حول Y 360 مع دوران الكرة والأسطوانة بالنسبة للمكعب -->
        <!-- يتم وضع الكرة والأسطوانة داخل المكعب ليصبحوا تابعين له في الدوران -->
        
        <a-sphere position="1 0.75 -2" radius="1.25" color="#EF2D5E"></a-sphere>
        
        <a-cylinder position="2 0.25 0" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
    </a-box>

    <!-- 
      الطلب الثالث (3.2.1): دوران المشهد بالكامل كمجموعة 
    -->
    <a-entity position="0 0 0" 
              animation="property: rotation; to: 0 360 0; loop: true; dur: 10000">
        <!-- (العناصر موجودة هنا في الأصل، ولكننا نستخدم دوران الكاميرا لتحقيق الطلب الثالث ليشمل المشهد كله) -->
    </a-entity>

    <!-- 
      الطلب الأول (1.2.1): تكبير وتصغير الكاميرا (Zoom)
    -->
    <a-camera position="0 1.6 3"
              animation="property: zoom; to: 2; dir: alternate; loop: true; dur: 3000; easing: linear"></a-camera>
              
    <!-- 
      ملاحظة للطلب الرابع: إذا لاحظت دوران الأسطوانة والكرة مع المكعب، فهذا بسبب وضعهما داخله، وهذا هو المطلوب.
      ملاحظة للطلب الخامس: حركة (animation__move) في المكعب تجعله يتحرك للأعلى والأسفل ويقترب من العناصر الأخرى.
    -->

</a-scene>
